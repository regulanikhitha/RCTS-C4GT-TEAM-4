services:
  # Frontend Static Site
  - type: web
    name: c4gt-hub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # Backend Web Service
  - type: web
    name: c4gt-hub-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: arigelamanikanta.1@gmail.com
      - key: SMTP_PASS
        value: "fafo vqmk zoll hzkq"
      - key: SMTP_FROM
        value: "C4GT Hub <arigelamanikanta.1@gmail.com>"
